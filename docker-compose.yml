services:
  postgres:
    image: postgres:16
    container_name: ${LOCAL_POSTGRES_CONTAINER:-jbot-local-pg}
    restart: unless-stopped
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-jbot_local}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-postgres} -d ${LOCAL_POSTGRES_DB:-jbot_local}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: